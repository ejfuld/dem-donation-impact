name: Refresh race data

on:
  schedule:
    - cron: '7 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impact
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run refresh
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python scripts/refresh.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ../data.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "data refresh $(date -u +'%Y-%m-%d')"
          git push
